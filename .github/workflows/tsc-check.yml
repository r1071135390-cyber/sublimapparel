# .github/workflows/tsc-check.yml
#
# R78 follow-up: catch TypeScript errors BEFORE pushing to Cloudflare Pages,
# so we don't repeat the R46→R61 4-build-stall (4×3-min wasted on CF
# per-error feedback). Runs `pnpm tsc --noEmit` on every PR + push to main.
#
# Triggers: pull_request, push to main
# Runs on: ubuntu-latest
# Cache: pnpm store (saves ~30s per run)
# Timeout: 5 min (matches Cloudflare Pages build cap — if we hit it on
#          GitHub Actions, the same code will probably also timeout on CF)

name: tsc-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tsc-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: pnpm tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version is pinned in package.json "packageManager" field
        # (pnpm@9.0.0) — keep them in sync to avoid ERR_PNPM_BAD_PM_VERSION.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 is deprecated on GitHub Actions (Sept 2025).
          # Use 24 to match the latest LTS and silence the runner warning.
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run TypeScript type check
        run: pnpm tsc --noEmit

      - name: Run Next.js lint (if configured)
        run: |
          if grep -q '"lint"' package.json; then
            pnpm lint
          else
            echo "No lint script in package.json, skipping"
          fi
        continue-on-error: false

      - name: Verify Supabase migrations have no trailing commas in IN-clauses
        run: |
          # Trailing commas in IN clauses caused R77 sync_failure; flag them early.
          set -e
          if [ -d supabase/migrations ]; then
            for f in supabase/migrations/*.sql; do
              echo "Checking $f"
              if grep -nE 'IN[[:space:]]*\([[:space:]]*[^)]*,[[:space:]]*\)' "$f"; then
                echo "::error file=$f::Trailing comma inside IN() — remove it"
                exit 1
              fi
            done
          else
            echo "No supabase/migrations directory, skipping"
          fi